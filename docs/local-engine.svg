<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 300" width="860" height="300" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>DragTranslate local engine: selected text goes to Ollama on localhost and back, without leaving the PC</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="860" height="300" rx="12" fill="#ffffff"/>

  <!-- PC boundary -->
  <rect x="16" y="16" width="828" height="232" rx="12" fill="#f8fafc" stroke="#22c58b" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="32" y="42" font-size="14" font-weight="700" fill="#15803d">Your PC — nothing leaves this box</text>

  <!-- Any app -->
  <rect x="40" y="70" width="170" height="130" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="125" y="100" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">Any app</text>
  <text x="125" y="124" font-size="12.5" fill="#475569" text-anchor="middle">Outlook, browser,</text>
  <text x="125" y="142" font-size="12.5" fill="#475569" text-anchor="middle">PDF, ERP …</text>
  <text x="125" y="176" font-size="12.5" fill="#3d5af1" text-anchor="middle" font-weight="600">select text</text>

  <!-- DragTranslate -->
  <rect x="300" y="70" width="200" height="130" rx="10" fill="#ffffff" stroke="#3d5af1" stroke-width="1.5"/>
  <text x="400" y="100" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">DragTranslate</text>
  <text x="400" y="124" font-size="12.5" fill="#475569" text-anchor="middle">captures selection,</text>
  <text x="400" y="142" font-size="12.5" fill="#475569" text-anchor="middle">picks the direction,</text>
  <text x="400" y="160" font-size="12.5" fill="#475569" text-anchor="middle">shows the popup</text>
  <text x="400" y="186" font-size="11.5" fill="#64748b" text-anchor="middle">"engine": "ollama"</text>

  <!-- Ollama + model -->
  <rect x="590" y="70" width="230" height="130" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="705" y="100" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">Ollama</text>
  <text x="705" y="120" font-size="12" fill="#64748b" text-anchor="middle">127.0.0.1:11434</text>
  <rect x="608" y="134" width="194" height="52" rx="8" fill="#eef2ff" stroke="#c7d2fe"/>
  <text x="705" y="156" font-size="13" font-weight="700" fill="#1e1b4b" text-anchor="middle">Tencent Hy-MT2-1.8B</text>
  <text x="705" y="175" font-size="11.5" fill="#475569" text-anchor="middle">GGUF Q4_K_M · 1.1 GB · CPU</text>

  <!-- arrows -->
  <line x1="212" y1="135" x2="296" y2="135" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="502" y1="118" x2="586" y2="118" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="544" y="110" font-size="11" fill="#64748b" text-anchor="middle">text</text>
  <line x1="586" y1="160" x2="502" y2="160" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="544" y="178" font-size="11" fill="#64748b" text-anchor="middle">translation</text>

  <!-- internet, crossed out -->
  <text x="430" y="284" font-size="13" fill="#94a3b8" text-anchor="middle">Internet / Google Translate — not used: no rate limit, works offline</text>
  <line x1="400" y1="250" x2="400" y2="266" stroke="#cbd5e1" stroke-width="1.6" stroke-dasharray="3 3"/>
  <text x="400" y="262" font-size="16" fill="#ef4444" text-anchor="middle" font-weight="700" dx="14">✕</text>
</svg>
